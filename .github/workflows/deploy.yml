name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main  # Asegúrate de que este sea el nombre de tu rama principal

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Versión de Node compatible con tu proyecto

      - name: Install dependencies
        run: npm install

      - name: Inject Secrets
        run: |
          sed -i "s/WALTER_AI_KEY_PLACEHOLDER/${{ secrets.WALTER_AI_API_KEY }}/g" src/environments/environment.prod.ts

      - name: Build
        run: npm run build -- --base-href /portfolio/

      - name: Fix for 404 on refresh
        run: cp dist/bookman/browser/index.html dist/bookman/browser/404.html

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist/bookman/browser
          branch: gh-pages
