<!-- El contenedor ahora es sólido para el mouse y cambia de tamaño según el estado -->
<div class="fixed top-0 left-0 transition-all duration-300 z-50 print:hidden"
     [class.w-80]="open()" [class.h-80]="open()"
     [class.w-24]="!open()" [class.h-24]="!open()"
     (mouseleave)="open.set(false)">

  <!-- Botón Principal (Gatillo) -->
  <button id="thething"
    (mouseenter)="open.set(true)"
    class="bg-retro-muted text-retro-bright absolute top-10 left-10 w-12 h-12 rounded-full text-2xl flex items-center justify-center z-20 border border-retro-yellow/30 shadow-lg"
  >
    <ng-icon
      [svg]="excludedIcons.tablerMenu2"
      size="18" strokeWidth="2"
      class="transition-transform duration-300 ease-in-out"
      [style.transform]="open() ? 'rotate(90deg)' : 'rotate(0deg)'"
    />
  </button>

  <!-- Área de los botones -->
  <div class="absolute top-10 left-10 z-10" [style.visibility]="open() ? 'visible' : 'hidden'">
    @for (item of icons.keys(); track $index; let i = $index) {
      
      @if (icons.get(item)?.icon) {
        <button
          class="group absolute w-10 h-10 bg-retro-muted text-retro-bright rounded-full flex items-center justify-center transition-all duration-300 border border-retro-yellow/20 hover:border-retro-yellow shadow-md"
          [style.transform]="open() ? 'translate(' + positions()[i].x + 'px,' + positions()[i].y + 'px)' : 'translate(0,0)'"
          [style.opacity]="open() ? 1 : 0"
          [routerLink]="[ '/' + item ]"
          (click)="open.set(false)"
        >
            <ng-icon
              [svg]="icons.get(item)?.icon"
              size="20" strokeWidth="2"
            />

            <!-- Tooltip -->
            <span class="absolute left-full ml-3 px-2 py-1 bg-retro-bright text-retro-yellow text-[10px] font-bold rounded opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap uppercase tracking-widest border border-retro-yellow/30">
              {{ icons.get(item)?.label }}
            </span>
        </button>
      } @else {
        <div
          class="absolute w-2 h-2 bg-retro-yellow/40 rounded-full transition-all duration-300"
          [style.transform]="open() ? 'translate(' + (positions()[i].x + 16) + 'px,' + (positions()[i].y + 16) + 'px)' : 'translate(0,0)'"
          [style.opacity]="open() ? 1 : 0"
        ></div>
      }

    }
  </div>

</div>
