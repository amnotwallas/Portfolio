<main class="relative flex flex-col min-h-screen pt-24 pb-32 md:pt-12 md:pb-32 px-4 md:px-8 lg:px-24 overflow-x-hidden">
  
  <app-home-status 
    [systemId]="cv.system.id"
    [location]="cv.system.location.city + ' // ' + cv.system.location.coords"
    [status]="cv.system.status"
    [uptime]="uptime">
  </app-home-status>

  <app-home-logs [logs]="currentLogs"></app-home-logs>

  <!-- Hero & Intro Section -->
  <div class="relative flex flex-col items-center z-10 w-full max-w-6xl mx-auto min-h-[80vh] justify-center">
    <app-home-hero 
      [firstName]="firstName" 
      [activeTitle]="activeTitle">
    </app-home-hero>

    <app-home-chat></app-home-chat>
  </div>

  <!-- Detailed Sections -->
  <div class="relative z-10 space-y-32 mt-20">
    <app-home-experience></app-home-experience>
    <app-home-projects></app-home-projects>
  </div>

</main>
