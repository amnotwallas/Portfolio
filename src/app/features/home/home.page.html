<main class="min-h-screen">
    <!-- Scrollable Content -->
    <div class="pt-32 pb-24">
        <app-home-hero [firstName]="firstName" [activeTitle]="activeTitle"></app-home-hero>
        
        <div class="container mx-auto px-6 mt-32 space-y-32">
            <!-- Experience (Lazy Hydration) -->
            @defer (on viewport) {
                <app-home-experience></app-home-experience>
            } @placeholder {
                <div class="h-[500px] w-full bg-retro-dark animate-pulse opacity-5"></div>
            }

            <!-- Projects (Lazy Hydration) -->
            @defer (on viewport) {
                <app-home-projects></app-home-projects>
            } @placeholder {
                <div class="h-[800px] w-full bg-retro-dark animate-pulse opacity-5"></div>
            }
        </div>
    </div>

    <!-- Chat Interface (Defer until Idle) -->
    @defer (on idle) {
        <app-home-chat></app-home-chat>
    }
</main>
