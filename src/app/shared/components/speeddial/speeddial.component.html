<!-- Contenedor ajustado -->
<div class="fixed top-0 left-0 transition-all z-50 print:hidden"
     [class.w-80]="open()" [class.h-80]="open()"
     [class.w-20]="!open()" [class.h-20]="!open()"
     (mouseleave)="open.set(false)">

  <!-- Botón Principal (Gatillo) -->
  <button id="thething"
    (mouseenter)="open.set(true)"
    (click)="toggle()"
    class="glass-effect text-retro-bright absolute top-6 left-6 md:top-10 md:left-10 w-12 h-12 rounded-xl flex items-center justify-center z-20 transition-all duration-300 group overflow-hidden"
    [class.border-retro-yellow/50]="open()"
    [class.border-retro-yellow/10]="!open()"
  >
    <!-- Background glow effect -->
    <div class="absolute inset-0 bg-retro-yellow/5 opacity-0 group-hover:opacity-100 transition-opacity"></div>
    
    <ng-icon
      [svg]="excludedIcons.tablerMenu2"
      size="22" strokeWidth="1.5"
      class="transition-transform duration-500 ease-in-out relative z-10"
      [class.text-retro-yellow]="open()"
      [style.transform]="open() ? 'rotate(180deg)' : 'rotate(0deg)'"
    />
  </button>

  <!-- Área de los botones -->
  <div class="absolute top-6 left-6 md:top-10 md:left-10 z-10" [style.visibility]="open() ? 'visible' : 'hidden'">
    @for (item of icons.keys(); track $index; let i = $index) {
      
      @if (icons.get(item)?.icon) {
        <button
          class="group absolute w-10 h-10 glass-effect text-retro-bright/70 rounded-lg flex items-center justify-center transition-all duration-500 hover:text-retro-yellow hover:border-retro-yellow/40 hover:scale-110"
          [style.transform]="open() ? 'translate(' + positions()[i].x + 'px,' + positions()[i].y + 'px)' : 'translate(0,0)'"
          [style.opacity]="open() ? 1 : 0"
          [style.transition-delay]="(i * 50) + 'ms'"
          (click)="navigateTo(icons.get(item))"
        >
            <ng-icon
              [svg]="icons.get(item)?.icon"
              size="20" strokeWidth="1.5"
            />

            <!-- Tooltip Estilo Terminal -->
            <span class="absolute left-full ml-4 px-2 py-1 bg-retro-dark/90 backdrop-blur-md text-retro-yellow text-[9px] font-mono rounded border border-retro-yellow/20 opacity-0 group-hover:opacity-100 transition-all duration-300 pointer-events-none whitespace-nowrap uppercase tracking-[0.2em] translate-x-[-10px] group-hover:translate-x-0">
              <span class="text-retro-yellow/40 mr-1">></span>{{ icons.get(item)?.label }}
            </span>
        </button>
      } @else {
        <!-- Separador sutil -->
        <div
          class="absolute w-1 h-1 bg-retro-yellow/20 rounded-full transition-all duration-500"
          [style.transform]="open() ? 'translate(' + (positions()[i].x + 18) + 'px,' + (positions()[i].y + 18) + 'px)' : 'translate(0,0)'"
          [style.opacity]="open() ? 1 : 0"
          [style.transition-delay]="(i * 50) + 'ms'"
        ></div>
      }

    }
  </div>

</div>
